[project]
name = "intervieweragent"
version = "0.1.0"
description = "AI 面试官 Agent：简历解析 → 联网核实 → 模拟面试 → 评估报告"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    # Agent / LLM（统一走 langchain-openai 的 OpenAI 兼容协议）
    "langchain>=1.4.0",
    "langchain-openai>=1.6.2",
    "langchain-tavily>=0.2.18",
    "python-dotenv>=1.2.3",
    # Web 接入层
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.53.0",
    "python-multipart>=0.0.32",   # 简历 multipart 上传必需
    "pydantic-settings>=2.15.0",  # config.py 配置出口
    # 数据层（MySQL 8）
    "sqlalchemy>=2.0.54",
    "pymysql>=1.2.3",
    "cryptography>=50.0.1",       # MySQL 8 caching_sha2_password 认证
    # 简历解析 / 网页抓取
    "pymupdf>=1.28.2",
    "python-docx>=1.2.0",
    "httpx>=0.28.1",
]

[[tool.uv.index]]
url = "https://mirrors.aliyun.com/pypi/simple/"
default = true

[tool.uv]
# 本项目是应用而非库：uv 只管理环境，不构建/安装自身
package = false

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
# 从仓库根目录执行 uv run pytest 即可：backend/ 加入导入路径，app 包可被解析
pythonpath = ["backend"]
testpaths = ["backend/tests"]
asyncio_mode = "auto"